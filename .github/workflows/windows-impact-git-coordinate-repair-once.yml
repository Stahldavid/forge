name: Windows Impact Git Coordinate Repair Once

on:
  push:
    branches:
      - fix/windows-agent-memory-testgraph-isolation

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-agent-memory-testgraph-isolation
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: bun install --ignore-scripts

      - name: Apply Git-coordinate repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/forge/impact/index.ts')
          text = path.read_text(encoding='utf-8')

          old_import = 'import { delimiter, dirname, join, relative, resolve } from "node:path";'
          new_import = 'import { delimiter, dirname, join } from "node:path";'
          if text.count(old_import) != 1:
              raise SystemExit('unexpected node:path import')
          text = text.replace(old_import, new_import)

          old_git_root = '''function gitRoot(workspaceRoot: string): string | null {
            const result = spawnSync("git", ["rev-parse", "--show-toplevel"], {
              cwd: workspaceRoot,
              encoding: "utf8",
              windowsHide: true,
            });
            if (result.status !== 0) {
              return null;
            }
            return result.stdout.trim() || null;
          }
          '''
          new_git_prefix = '''function gitWorkspacePrefix(workspaceRoot: string): string | null {
            const result = spawnSync("git", ["rev-parse", "--show-prefix"], {
              cwd: workspaceRoot,
              encoding: "utf8",
              windowsHide: true,
            });
            if (result.status !== 0) {
              return null;
            }
            return normalize(result.stdout.trim()).replace(/\\/+$/u, "");
          }
          '''
          if text.count(old_git_root) != 1:
              raise SystemExit('unexpected gitRoot helper')
          text = text.replace(old_git_root, new_git_prefix)

          old_scope = '''function scopeGitFilesToWorkspace(workspaceRoot: string, files: string[]): string[] {
            const root = gitRoot(workspaceRoot);
            if (!root) {
              return files;
            }
            const gitTop = normalize(resolve(root));
            const workspace = normalize(resolve(workspaceRoot));
            if (gitTop === workspace) {
              return files;
            }
          
            const prefix = normalize(relative(gitTop, workspace));
            if (!prefix || prefix.startsWith("..") || prefix.includes(":")) {
              return files;
            }
          
            return files
              .filter((file) => file.startsWith(`${prefix}/`))
              .map((file) => file.slice(prefix.length + 1))
              .filter(Boolean)
              .sort();
          }
          '''
          new_scope = '''function scopeGitFilesToWorkspace(workspaceRoot: string, files: string[]): string[] {
            const prefix = gitWorkspacePrefix(workspaceRoot);
            if (prefix === null || prefix === "") {
              return files;
            }
          
            return files
              .filter((file) => file.startsWith(`${prefix}/`))
              .map((file) => file.slice(prefix.length + 1))
              .filter(Boolean)
              .sort();
          }
          '''
          if text.count(old_scope) != 1:
              raise SystemExit('unexpected workspace scoping block')
          text = text.replace(old_scope, new_scope)

          old_head = '''function readHeadFile(workspaceRoot: string, file: string): string | null {
            const root = gitRoot(workspaceRoot);
            if (!root) {
              return null;
            }
          
            const relativeToGitRoot = normalize(relative(resolve(root), resolve(workspaceRoot, file)));
            if (!relativeToGitRoot || relativeToGitRoot.startsWith("..") || relativeToGitRoot.includes(":")) {
              return null;
            }
          
            const result = spawnSync("git", ["show", `HEAD:${relativeToGitRoot}`], {
              cwd: workspaceRoot,
              encoding: "utf8",
              windowsHide: true,
            });
            if (result.status !== 0) {
              return null;
            }
            return result.stdout;
          }
          '''
          new_head = '''function readHeadFile(workspaceRoot: string, file: string): string | null {
            const prefix = gitWorkspacePrefix(workspaceRoot);
            if (prefix === null) {
              return null;
            }
          
            const workspaceFile = normalize(file);
            if (
              !workspaceFile ||
              workspaceFile === ".." ||
              workspaceFile.startsWith("../") ||
              workspaceFile.startsWith("/") ||
              workspaceFile.includes(":")
            ) {
              return null;
            }
            const repoFile = prefix ? `${prefix}/${workspaceFile}` : workspaceFile;
          
            const result = spawnSync("git", ["show", `HEAD:${repoFile}`], {
              cwd: workspaceRoot,
              encoding: "utf8",
              windowsHide: true,
            });
            if (result.status !== 0) {
              return null;
            }
            return result.stdout;
          }
          '''
          if text.count(old_head) != 1:
              raise SystemExit('unexpected readHeadFile block')
          text = text.replace(old_head, new_head)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git diff --check
          git diff -- src/forge/impact/index.ts

      - name: Run Windows H28 regression
        shell: bash
        run: bun test tests/impact/h28-impact.test.ts --timeout 120000

      - name: Typecheck repair
        shell: bash
        run: bun run typecheck

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/windows-impact-git-coordinate-repair-once.yml
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              src/forge/impact/index.ts|.github/workflows/windows-impact-git-coordinate-repair-once.yml) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/forge/impact/index.ts .github/workflows/windows-impact-git-coordinate-repair-once.yml
          git commit -m 'fix(impact): use git-relative workspace coordinates'
          git push origin HEAD:fix/windows-agent-memory-testgraph-isolation
