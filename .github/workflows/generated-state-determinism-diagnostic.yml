name: Generated State Determinism Diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/generated-state-determinism-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    name: diagnose (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]
    env:
      SUBJECT_SHA: f8f33f3b89afe2c742986d746eb726a03f2591aa
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        shell: bash
        run: bun install --ignore-scripts

      - name: Capture pristine provenance
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/generated-state"
          out="$RUNNER_TEMP/generated-state"
          printf 'subject=%s\nexecution=%s\ntree=%s\nos=%s\nnode=%s\nbun=%s\nautocrlf=%s\neol=%s\n' \
            "$SUBJECT_SHA" \
            "$(git rev-parse HEAD)" \
            "$(git show -s --format=%T HEAD)" \
            "$RUNNER_OS" \
            "$(node --version)" \
            "$(bun --version)" \
            "$(git config --get core.autocrlf || true)" \
            "$(git config --get core.eol || true)" > "$out/provenance.txt"
          git status --porcelain=v1 > "$out/pristine-status.txt"
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git status --porcelain=v1)"

      - name: Generate
        shell: bash
        run: |
          out="$RUNNER_TEMP/generated-state"
          set +e
          node ./bin/forge.mjs generate > "$out/generate.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$out/generate.exit"
          test "$code" -eq 0

      - name: Capture generated-state content evidence
        shell: bash
        run: |
          out="$RUNNER_TEMP/generated-state"
          git status --porcelain=v1 > "$out/status.txt"
          git diff --name-only > "$out/diff-names.txt"
          git diff --stat > "$out/diff-stat.txt"
          git diff --full-index --binary > "$out/generated.patch"
          git diff --ignore-cr-at-eol --name-only > "$out/diff-names-ignore-cr-at-eol.txt"
          git diff --ignore-space-at-eol --name-only > "$out/diff-names-ignore-space-at-eol.txt"
          git diff --numstat > "$out/numstat.txt"
          git ls-files -m > "$out/ls-files-modified.txt"
          git update-index --refresh || true
          git status --porcelain=v1 > "$out/status-after-refresh.txt"
          node - <<'NODE' > "$out/working-tree-hashes.tsv"
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const status = execFileSync('git', ['status', '--porcelain=v1'], { encoding: 'utf8' });
          const paths = [...new Set(status.split(/\r?\n/).filter(Boolean).map(line => line.slice(3)))].sort();
          for (const path of paths) {
            let work = '';
            let head = '';
            try { work = createHash('sha256').update(readFileSync(path)).digest('hex'); } catch {}
            try { head = createHash('sha256').update(execFileSync('git', ['show', `HEAD:${path}`])).digest('hex'); } catch {}
            process.stdout.write(`${path}\t${head}\t${work}\t${head === work ? 'RAW_EQUAL' : 'RAW_DIFFERENT'}\n`);
          }
          NODE

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-state-${{ matrix.os }}-node${{ matrix.node }}
          path: ${{ runner.temp }}/generated-state
          if-no-files-found: error
