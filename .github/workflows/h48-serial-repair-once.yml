name: H48 Serial Repair Once

on:
  push:
    branches:
      - fix/windows-agent-memory-testgraph-isolation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-agent-memory-testgraph-isolation
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: bun install --ignore-scripts

      - name: Move H48 from isolated to serial lane
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          verify = Path('src/forge/cli/verify.ts')
          text = verify.read_text(encoding='utf-8')
          isolated = r'  /^tests\/agent-memory\/h48-agent-memory\.test\.ts$/,'
          if text.count(isolated) != 1:
              raise SystemExit('expected exactly one H48 isolated pattern')
          text = text.replace(isolated + '\n', '')
          serial_old = 'const STRICT_SERIAL_TEST_PATTERNS: RegExp[] = [];'
          serial_new = r'''const STRICT_SERIAL_TEST_PATTERNS: RegExp[] = [
            /^tests\/agent-memory\/h48-agent-memory\.test\.ts$/,
          ];'''
          if text.count(serial_old) != 1:
              raise SystemExit('unexpected serial pattern declaration')
          text = text.replace(serial_old, serial_new)
          verify.write_text(text, encoding='utf-8', newline='\n')

          test_file = Path('tests/cli/cli.test.ts')
          tests = test_file.read_text(encoding='utf-8')
          old_assert = '    expect(classifyStrictTestFile("tests/agent-memory/h48-agent-memory.test.ts")).toBe("isolated");'
          new_assert = '    expect(classifyStrictTestFile("tests/agent-memory/h48-agent-memory.test.ts")).toBe("serial");'
          if tests.count(old_assert) != 1:
              raise SystemExit('unexpected H48 classification assertion')
          tests = tests.replace(old_assert, new_assert)
          test_file.write_text(tests, encoding='utf-8', newline='\n')
          PY

          git diff --check
          git diff -- src/forge/cli/verify.ts tests/cli/cli.test.ts

      - name: Prove H48 serial scheduler semantics
        shell: bash
        run: |
          bun -e 'import { buildStrictTestGraphPlan, classifyStrictTestFile } from "./src/forge/cli/verify.ts"; const file = "tests/agent-memory/h48-agent-memory.test.ts"; if (classifyStrictTestFile(file) !== "serial") process.exit(1); const plan = buildStrictTestGraphPlan(process.cwd()); const chunk = plan.chunks.find((c) => c.files.includes(file)); console.log(JSON.stringify(chunk, null, 2)); if (!chunk || chunk.lane !== "serial" || chunk.files.length !== 1 || chunk.estimatedMs !== 105000) process.exit(1);'

      - name: Typecheck repair
        shell: bash
        run: bun run typecheck

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/h48-serial-repair-once.yml
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              src/forge/cli/verify.ts|tests/cli/cli.test.ts|.github/workflows/h48-serial-repair-once.yml) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/forge/cli/verify.ts tests/cli/cli.test.ts .github/workflows/h48-serial-repair-once.yml
          git commit -m 'test(verify): serialize heavy agent-memory TestGraph file'
          git push origin HEAD:fix/windows-agent-memory-testgraph-isolation
