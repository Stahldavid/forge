name: Generated State Refresh Once

on:
  pull_request:
    paths:
      - ".github/workflows/generated-state-refresh-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Generate canonical repository state
        run: |
          node ./bin/forge.mjs generate
          node ./bin/forge.mjs generate --check

      - name: Validate refresh scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected=0
          while IFS= read -r path; do
            case "$path" in
              AGENTS.md|forge.lock|src/forge/_generated/*) ;;
              *)
                echo "unexpected generated-state path: $path" >&2
                unexpected=1
                ;;
            esac
          done < <(git diff --name-only)
          if [ "$unexpected" -ne 0 ]; then
            exit 1
          fi
          count=$(git diff --name-only | sed '/^$/d' | wc -l | tr -d ' ')
          echo "generated paths: $count"
          test "$count" -gt 0

      - name: Remove one-shot workflow and commit refresh
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/generated-state-refresh-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(compiler): refresh generated state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
