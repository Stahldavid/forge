name: Generated State Refresh V2 Once

on:
  push:
    branches:
      - chore/generated-state-refresh-v2

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          ref: chore/generated-state-refresh-v2
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Generate canonical repository state
        shell: bash
        run: |
          node ./bin/forge.mjs generate
          node ./bin/forge.mjs generate --check

      - name: Validate refresh scope
        shell: bash
        run: |
          workflow=.github/workflows/generated-state-refresh-v2-once.yml
          while IFS= read -r path; do
            case "$path" in
              AGENTS.md|forge.lock|src/forge/_generated/*|"$workflow") ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)

      - name: Remove one-shot workflow and commit refresh
        shell: bash
        run: |
          rm .github/workflows/generated-state-refresh-v2-once.yml
          while IFS= read -r path; do
            case "$path" in
              AGENTS.md|forge.lock|src/forge/_generated/*|.github/workflows/generated-state-refresh-v2-once.yml) ;;
              *) echo "unexpected final changed path: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(compiler): refresh canonical generated state"
          git push origin HEAD:chore/generated-state-refresh-v2
