name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Node CLI smoke
        run: |
          node ./bin/forge.mjs inspect framework --json
          node ./bin/forge.mjs inspect capabilities --json

      - name: Typecheck
        run: bun run typecheck

      # Security Assurance runs the complete strict TestGraph once. This job
      # checks compiler drift and package behavior without rerunning that suite.
      # Framework source and tests are generator inputs. Derived files are
      # regenerated in CI instead of committing machine-specific graph churn.
      - name: Generate derived compiler output
        run: node ./bin/forge.mjs generate

      - name: Check generated output stability
        run: node ./bin/forge.mjs generate --check

      - name: Check compiler workspace
        run: node ./bin/forge.mjs check

      - name: Lint
        run: npm run lint

      - name: Setup basic example
        run: node scripts/setup-example.mjs

      - name: Generate example output
        working-directory: examples/basic-forge-app
        run: bun ../../src/forge/cli/main.ts generate

      - name: Example drift check
        working-directory: examples/basic-forge-app
        run: bun ../../src/forge/cli/main.ts generate --check

      - name: package manager template smoke
        run: |
          mkdir -p "$RUNNER_TEMP/forge-template-smoke"
          cd "$RUNNER_TEMP/forge-template-smoke"
          for pm in npm pnpm yarn bun; do
            node "$GITHUB_WORKSPACE/bin/forge.mjs" new "$pm-smoke" --template minimal-web --package-manager "$pm" --no-install --no-git
            grep "\"packageManager\": \"$pm@" "$pm-smoke/package.json"
          done

      - name: Packed package smoke
        run: npm run release:smoke

  node-breadth:
    name: Node smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # PRs exercise Node 22 on Linux and Windows. Main also checks Node 24 on
      # Linux and Node 22 on macOS. Template/package-manager scaffolding runs
      # once in verify, not on every matrix runner.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node-version":22},{"os":"windows-latest","node-version":22}]' || '[{"os":"ubuntu-latest","node-version":22},{"os":"ubuntu-latest","node-version":24},{"os":"windows-latest","node-version":22},{"os":"macos-latest","node-version":22}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies with npm
        run: npm install --ignore-scripts --package-lock=false

      - name: Node CLI smoke
        shell: bash
        run: |
          node ./bin/forge.mjs inspect framework --json
          node ./bin/forge.mjs inspect capabilities --json

      - name: Windows native diagnostics
        if: runner.os == 'Windows'
        run: node .\bin\forge.mjs doctor windows --json

  external-quickstart:
    name: External quickstart smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ForgeOS workspace dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: Create, install, and verify an external app
        shell: bash
        run: |
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          node "$GITHUB_WORKSPACE/bin/forge.mjs" new smoke-app \
            --template minimal-web \
            --package-manager npm \
            --forge-spec "file:$GITHUB_WORKSPACE" \
            --install \
            --no-git
          cd smoke-app
          npm run generate
          npm run forge -- dev --once --json
          npm run forge -- verify --smoke --json --script-timeout-ms 120000
