name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      templates: ${{ steps.paths.outputs.templates }}
      package: ${{ steps.paths.outputs.package }}
      runtime: ${{ steps.paths.outputs.runtime }}
      fabric_only: ${{ steps.paths.outputs.fabric_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          let paths;
          try {
            if (!process.env.BASE_SHA || /^0+$/.test(process.env.BASE_SHA)) throw new Error('initial push');
            paths = execFileSync('git', ['diff', '--name-only', '-z', process.env.BASE_SHA, process.env.HEAD_SHA], { encoding: 'utf8' }).split('\0').filter(Boolean);
          } catch { paths = ['package.json']; } // Missing history runs all optional checks.
          const common = /^(package\.json|bun\.lock|\.npmrc|tsconfig[^/]*|bin\/|\.github\/workflows\/ci\.yml)/;
          const templates = paths.some(path => common.test(path) || /^(templates\/|examples\/|packages\/|scripts\/|schemas\/|adapters\/)/.test(path) || (path.startsWith('src/') && !/^src\/forge\/(agent-fabric|agent-memory|adaptive|_generated)\//.test(path)));
          const runtime = paths.some(path => common.test(path) || /^(src\/|adapters\/|schemas\/|packages\/)/.test(path));
          const packaging = paths.some(path => common.test(path) || /^(src\/|adapters\/|schemas\/|templates\/|packages\/|scripts\/|README\.md|LICENSE|CHANGELOG\.md|AGENTS\.md|\.npmignore)/.test(path));
          const fabricPath = /^(src\/forge\/agent-fabric\/(program-(authoring|templates|benchmark|observation|view)|claude-program-worker)\.ts$|tests\/agent-fabric\/program-(authoring|author-template|adapters|runtime-competitive)\.test\.ts$|examples\/agent-fabric-v2\/templates\/)/;
          const safeCompanion = /^(docs\/|src\/forge\/_generated\/)/;
          // Core owner/store/workspace/services and unknown/shared paths retain full regressions.
          const fabricOnly = paths.some(path => fabricPath.test(path)) && paths.every(path => fabricPath.test(path) || safeCompanion.test(path));
          appendFileSync(process.env.GITHUB_OUTPUT, `templates=${templates}\npackage=${packaging}\nruntime=${runtime}\nfabric_only=${fabricOnly}\n`);
          NODE

  verify:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Node CLI smoke
        run: |
          node ./bin/forge.mjs inspect framework --json
          node ./bin/forge.mjs inspect capabilities --json

      - name: Typecheck
        run: bun run typecheck

      # Security Assurance runs security proofs and security tests. This job
      # checks compiler drift and package behavior without duplicating proofs.
      # Framework source and tests are generator inputs. Derived files are
      # regenerated in CI instead of committing machine-specific graph churn.
      - name: Generate derived compiler output
        run: node ./bin/forge.mjs generate

      - name: Check generated output stability
        run: node ./bin/forge.mjs generate --check

      - name: Check compiler workspace
        run: node ./bin/forge.mjs check

      - name: Lint
        run: npm run lint

      - name: Workflow contract tests
        run: bun test tests/ci --timeout 120000

      - name: Agent Fabric critical regressions (Fabric-only PR)
        if: github.event_name == 'pull_request' && needs.changes.outputs.fabric_only == 'true'
        run: node scripts/run-fabric-ci.mjs

      - name: Agent Fabric full regressions (main or mixed changes)
        if: github.event_name != 'pull_request' || needs.changes.outputs.fabric_only != 'true'
        run: bun test tests/agent-fabric --timeout 120000

      - name: Native hook owner startup regression
        run: bun test tests/agent-memory/h48-agent-memory.test.ts --test-name-pattern "hook alone starts local owner" --timeout 120000

      - name: Setup basic example
        if: needs.changes.outputs.templates == 'true'
        run: node scripts/setup-example.mjs

      - name: Generate example output
        if: needs.changes.outputs.templates == 'true'
        working-directory: examples/basic-forge-app
        run: bun ../../src/forge/cli/main.ts generate

      - name: Example drift check
        if: needs.changes.outputs.templates == 'true'
        working-directory: examples/basic-forge-app
        run: bun ../../src/forge/cli/main.ts generate --check

      - name: package manager template smoke
        if: needs.changes.outputs.templates == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/forge-template-smoke"
          cd "$RUNNER_TEMP/forge-template-smoke"
          for pm in npm pnpm yarn bun; do
            node "$GITHUB_WORKSPACE/bin/forge.mjs" new "$pm-smoke" --template minimal-web --package-manager "$pm" --no-install --no-git
            grep "\"packageManager\": \"$pm@" "$pm-smoke/package.json"
          done


  packed-package:
    name: Packed package smoke
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Generate package artifacts
        run: node ./bin/forge.mjs generate
      - name: Packed package smoke
        run: npm run release:smoke

  node-breadth:
    needs: changes
    # Keep matrix check names present even when runtime smoke is unnecessary.
    name: Node smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Verify already covers Ubuntu/Node 22. PRs add Windows 22; main adds
      # Ubuntu 24. Template/package-manager scaffolding runs
      # once in verify, not on every matrix runner.
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '[{"os":"ubuntu-latest","node-version":24},{"os":"windows-latest","node-version":22},{"os":"macos-latest","node-version":22}]' || github.event_name == 'pull_request' && '[{"os":"windows-latest","node-version":22}]' || '[{"os":"ubuntu-latest","node-version":24},{"os":"windows-latest","node-version":22}]') }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.runtime == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.runtime == 'true'
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies with npm
        if: needs.changes.outputs.runtime == 'true'
        run: npm install --ignore-scripts --package-lock=false

      - name: Node CLI smoke
        if: needs.changes.outputs.runtime == 'true'
        shell: bash
        run: |
          node ./bin/forge.mjs inspect framework --json
          node ./bin/forge.mjs inspect capabilities --json

      - name: Windows native diagnostics
        if: needs.changes.outputs.runtime == 'true' && runner.os == 'Windows'
        run: node .\bin\forge.mjs doctor windows --json

  external-quickstart:
    needs: changes
    if: needs.changes.outputs.templates == 'true'
    name: External quickstart smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ForgeOS workspace dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: Create, install, and verify an external app
        shell: bash
        run: |
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          node "$GITHUB_WORKSPACE/bin/forge.mjs" new smoke-app \
            --template minimal-web \
            --package-manager npm \
            --forge-spec "file:$GITHUB_WORKSPACE" \
            --install \
            --no-git
          cd smoke-app
          npm run generate
          npm run forge -- dev --once --json
          npm run forge -- verify --smoke --json --script-timeout-ms 120000
