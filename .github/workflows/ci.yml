name: CI

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: afa3f108116be2b561a9ef3ec782d7849fecf7f2

      - name: Record exact-head execution provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "afa3f108116be2b561a9ef3ec782d7849fecf7f2"
          test -z "$(git status --porcelain)"
          echo "subject_sha=afa3f108116be2b561a9ef3ec782d7849fecf7f2"
          git log -1 --format='execution_sha=%H%ntree_sha=%T'
          git status --porcelain

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Node CLI smoke
        run: |
          node ./bin/forge.mjs inspect framework --json
          node ./bin/forge.mjs inspect capabilities --json

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        id: unit_integration_tests
        timeout-minutes: 20
        run: bun test

      - name: Unit/integration failure diagnostics
        if: ${{ failure() && steps.unit_integration_tests.outcome != 'success' }}
        shell: bash
        run: |
          echo "::group::Process snapshot after unit/integration failure"
          ps -eo pid,ppid,pgid,stat,etime,comm --forest || true
          echo "::endgroup::"

      - name: Generate committed compiler output
        run: bun run forge generate

      - name: Verify compiler workspace
        run: bun run forge verify --standard --script-timeout-ms 120000

      - name: Setup basic example
        run: node scripts/setup-example.mjs

      - name: Generate example output
        working-directory: examples/basic-forge-app
        run: bun ../../src/forge/cli/main.ts generate

      - name: Example drift check
        working-directory: examples/basic-forge-app
        run: bun ../../src/forge/cli/main.ts generate --check

      - name: package manager template smoke
        run: |
          mkdir -p "$RUNNER_TEMP/forge-template-smoke"
          cd "$RUNNER_TEMP/forge-template-smoke"
          for pm in npm pnpm yarn bun; do
            node "$GITHUB_WORKSPACE/bin/forge.mjs" new "$pm-smoke" --template minimal-web --package-manager "$pm" --no-install --no-git
            grep "\"packageManager\": \"$pm@" "$pm-smoke/package.json"
          done

      - name: Packed package smoke
        run: npm run release:smoke

  node-breadth:
    name: Node smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: afa3f108116be2b561a9ef3ec782d7849fecf7f2

      - name: Record exact-head execution provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "afa3f108116be2b561a9ef3ec782d7849fecf7f2"
          test -z "$(git status --porcelain)"
          echo "subject_sha=afa3f108116be2b561a9ef3ec782d7849fecf7f2"
          git log -1 --format='execution_sha=%H%ntree_sha=%T'
          git status --porcelain

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies with npm
        run: npm install --ignore-scripts --package-lock=false

      - name: Node CLI smoke
        shell: bash
        run: |
          node ./bin/forge.mjs inspect framework --json
          node ./bin/forge.mjs inspect capabilities --json

      - name: Windows native diagnostics
        if: runner.os == 'Windows'
        run: node .\bin\forge.mjs doctor windows --json

      - name: Minimal template package-manager smoke
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/forge-template-smoke"
          cd "$RUNNER_TEMP/forge-template-smoke"
          for pm in npm pnpm yarn bun; do
            node "$GITHUB_WORKSPACE/bin/forge.mjs" new "$pm-smoke" --template minimal-web --package-manager "$pm" --no-install --no-git
            node -e "const pkg=require('./$pm-smoke/package.json'); if (!pkg.packageManager.startsWith('$pm@')) process.exit(1)"
          done

  external-quickstart:
    name: External quickstart smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: afa3f108116be2b561a9ef3ec782d7849fecf7f2

      - name: Record exact-head execution provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "afa3f108116be2b561a9ef3ec782d7849fecf7f2"
          test -z "$(git status --porcelain)"
          echo "subject_sha=afa3f108116be2b561a9ef3ec782d7849fecf7f2"
          git log -1 --format='execution_sha=%H%ntree_sha=%T'
          git status --porcelain

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ForgeOS workspace dependencies
        run: npm install --ignore-scripts --package-lock=false

      - name: Create, install, and verify an external app
        shell: bash
        run: |
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          node "$GITHUB_WORKSPACE/bin/forge.mjs" new smoke-app \
            --template minimal-web \
            --package-manager npm \
            --forge-spec "file:$GITHUB_WORKSPACE" \
            --install \
            --no-git
          cd smoke-app
          npm run generate
          npm run forge -- dev --once --json
          npm run forge -- verify --smoke --json --script-timeout-ms 120000
