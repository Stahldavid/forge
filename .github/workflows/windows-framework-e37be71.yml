name: Windows Framework e37be71 Exact Proof

on:
  push:
    branches:
      - diagnostic/windows-framework-e37be71

permissions:
  contents: read

jobs:
  prove:
    runs-on: windows-latest
    env:
      SUBJECT_SHA: e37be713058b45c68a454b0512514fcd5aaaad11
    steps:
      - name: Checkout exact PR 39 final head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: bun install --ignore-scripts

      - name: Record exact clean provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git status --porcelain=v1)"
          printf 'subject=%s\nexecution=%s\ntree=%s\n' "$SUBJECT_SHA" "$(git rev-parse HEAD)" "$(git show -s --format=%T HEAD)"

      - name: Materialize candidate-derived generated state
        shell: bash
        run: |
          node ./bin/forge.mjs generate
          node ./bin/forge.mjs generate --check
          echo 'generated_worktree_changes:'
          git status --short

      - name: Prove scheduler and Windows impact regressions
        shell: bash
        run: |
          bun -e 'import { buildStrictTestGraphPlan } from "./src/forge/cli/verify.ts"; const f="tests/agent-memory/h48-agent-memory.test.ts"; const p=buildStrictTestGraphPlan(process.cwd()); const c=p.chunks.find(x=>x.files.includes(f)); console.log(JSON.stringify(c,null,2)); if(!c||c.lane!=="serial"||c.files.length!==1||c.estimatedMs!==105000||p.lanes.serial.chunkCount!==1) process.exit(1);'
          bun test tests/impact/h28-impact.test.ts --timeout 120000
          bun test tests/cli/cli.test.ts --test-name-pattern "strict TestGraph" --timeout 120000

      - name: Framework verification with real exit
        shell: bash
        run: node ./bin/forge.mjs verify framework --script-timeout-ms 120000
