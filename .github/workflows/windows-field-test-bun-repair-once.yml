name: Windows Bun Field Test Repair Once

on:
  push:
    branches:
      - fix/windows-field-test-bun-hardening

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-field-test-bun-hardening
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install checkout dependencies
        run: bun install --ignore-scripts

      - name: Apply narrow Windows Bun field-test repair
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const scriptPath = 'scripts/field-test-forgeos.mjs';
          let script = fs.readFileSync(scriptPath, 'utf8');
          const eol = script.includes('\r\n') ? '\r\n' : '\n';
          const commandPattern = /function commandName\(command\) \{\r?\n  return process\.platform === "win32" \? `\$\{command\}\.cmd` : command;\r?\n\}/;
          if (!commandPattern.test(script)) throw new Error('commandName source pattern not found');
          const newCommand = [
            'function commandName(command) {',
            '  if (process.platform !== "win32") return command;',
            '  return command === "bun" ? command : `${command}.cmd`;',
            '}',
            '',
            'function fieldScratchRoot() {',
            '  const runnerTemp = process.env.RUNNER_TEMP;',
            '  if (process.platform === "win32" && runnerTemp && isAbsolute(runnerTemp)) {',
            '    return runnerTemp;',
            '  }',
            '  return tmpdir();',
            '}',
          ].join(eol);
          script = script.replace(commandPattern, newCommand);

          const scratchPattern = /  const appRoot = await mkdtemp\(join\(tmpdir\(\), "forgeos-field-"\)\);/;
          if (!scratchPattern.test(script)) throw new Error('scratch source pattern not found');
          script = script.replace(scratchPattern, '  const appRoot = await mkdtemp(join(fieldScratchRoot(), "forgeos-field-"));');
          fs.writeFileSync(scriptPath, script, 'utf8');

          const testPath = 'tests/field/field-test-script.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          const testEol = test.includes('\r\n') ? '\r\n' : '\n';
          const closeMatch = /\r?\n\}\);\s*$/.exec(test);
          if (!closeMatch || closeMatch.index == null) throw new Error('test insertion point not found');
          const additions = [
            '',
            '',
            '  test("Windows Bun uses executable resolution instead of a fabricated cmd shim", () => {',
            '    const source = readFileSync("scripts/field-test-forgeos.mjs", "utf8");',
            '',
            '    expect(source).toContain(\'return command === "bun" ? command : `${command}.cmd`;\');',
            '  });',
            '',
            '  test("Windows field-test scratch prefers an absolute RUNNER_TEMP", () => {',
            '    const source = readFileSync("scripts/field-test-forgeos.mjs", "utf8");',
            '',
            '    expect(source).toContain(\'process.platform === "win32" && runnerTemp && isAbsolute(runnerTemp)\');',
            '    expect(source).toContain(\'mkdtemp(join(fieldScratchRoot(), "forgeos-field-"))\');',
            '    expect(source).toContain(\'return tmpdir();\');',
            '  });',
          ].join(testEol);
          test = test.slice(0, closeMatch.index) + additions + test.slice(closeMatch.index);
          fs.writeFileSync(testPath, test, 'utf8');
          NODE

      - name: Run focused source regressions
        shell: bash
        run: bun test tests/field/field-test-script.test.ts --timeout 120000

      - name: Prove Bun field path on native Windows temp selection
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/field-pack"
          PACK_FILE=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/field-pack" --json | node -e 'let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>process.stdout.write(JSON.parse(s)[0].filename))')
          PACK_SPEC=$(node --input-type=module -e 'import { resolve } from "node:path"; import { pathToFileURL } from "node:url"; console.log(pathToFileURL(resolve(process.argv[1])).href)' "$RUNNER_TEMP/field-pack/$PACK_FILE")
          PACK_PATH="${PACK_SPEC#file:///}"
          export MSYS2_ARG_CONV_EXCL="*"
          node -e 'const os=require("node:os"); console.log(JSON.stringify({tmpdir:os.tmpdir(),runnerTemp:process.env.RUNNER_TEMP},null,2))'
          node scripts/field-test-forgeos.mjs \
            --package-managers bun \
            --templates minimal-web \
            --forge-spec "$PACK_PATH" \
            --install \
            --json \
            --timeout-ms 240000 \
            > "$RUNNER_TEMP/bun-field-result.json"
          cat "$RUNNER_TEMP/bun-field-result.json"
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!p.ok) process.exit(1);' "$RUNNER_TEMP/bun-field-result.json"

      - name: Refresh and verify canonical generated state
        shell: bash
        run: |
          node ./bin/forge.mjs generate
          node ./bin/forge.mjs generate --check

      - name: Remove one-shot workflow and commit candidate
        shell: bash
        run: |
          rm .github/workflows/windows-field-test-bun-repair-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix(field-test): harden Windows Bun execution"
          git push origin HEAD:fix/windows-field-test-bun-hardening
