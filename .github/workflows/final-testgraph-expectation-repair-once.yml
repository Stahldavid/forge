name: Final TestGraph Expectation Repair Once

on:
  push:
    branches:
      - fix/windows-agent-memory-testgraph-isolation

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-agent-memory-testgraph-isolation
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        shell: bash
        run: bun install --ignore-scripts

      - name: Repair TestGraph expectations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/cli/cli.test.ts')
          text = path.read_text(encoding='utf-8')
          old_count = '    expect(plan.lanes.serial.chunkCount).toBe(0);'
          new_count = '    expect(plan.lanes.serial.chunkCount).toBe(1);'
          old_name = '  test("strict TestGraph lanes isolate global-heavy tests without serializing them", () => {'
          new_name = '  test("strict TestGraph lanes classify global-heavy tests across isolated and serial execution", () => {'
          if text.count(old_count) != 1:
              raise SystemExit('unexpected serial chunk expectation count')
          if text.count(old_name) != 1:
              raise SystemExit('unexpected lane test name count')
          text = text.replace(old_count, new_count)
          text = text.replace(old_name, new_name)
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git diff -- tests/cli/cli.test.ts

      - name: Run focused TestGraph regressions
        shell: bash
        run: bun test tests/cli/cli.test.ts --test-name-pattern "strict TestGraph" --timeout 120000

      - name: Remove one-shot workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/final-testgraph-expectation-repair-once.yml
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              tests/cli/cli.test.ts|.github/workflows/final-testgraph-expectation-repair-once.yml) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/cli/cli.test.ts .github/workflows/final-testgraph-expectation-repair-once.yml
          git commit -m 'test(verify): align TestGraph serial lane expectations'
          git push origin HEAD:fix/windows-agent-memory-testgraph-isolation
