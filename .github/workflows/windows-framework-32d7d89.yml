name: Windows Framework 32d7d89 Proof

on:
  push:
    branches:
      - diagnostic/windows-framework-32d7d89

permissions:
  contents: read

jobs:
  prove:
    runs-on: windows-latest
    env:
      SUBJECT_SHA: 32d7d89faaa3875027afbd3f0f687069777c2d6d
    steps:
      - name: Checkout exact final PR39 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: bun install --ignore-scripts

      - name: Record exact clean provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git status --porcelain=v1)"
          printf 'subject=%s\nexecution=%s\ntree=%s\n' "$SUBJECT_SHA" "$(git rev-parse HEAD)" "$(git show -s --format=%T HEAD)"

      - name: Prove Windows H28 regression
        shell: bash
        run: bun test tests/impact/h28-impact.test.ts --timeout 120000

      - name: Materialize candidate-derived generated state
        shell: bash
        run: |
          node ./bin/forge.mjs generate
          node ./bin/forge.mjs generate --check

      - name: Prove H48 scheduler classification
        shell: bash
        run: |
          bun -e 'import { buildStrictTestGraphPlan } from "./src/forge/cli/verify.ts"; const file = "tests/agent-memory/h48-agent-memory.test.ts"; const plan = buildStrictTestGraphPlan(process.cwd()); const chunk = plan.chunks.find((c) => c.files.includes(file)); console.log(JSON.stringify(chunk, null, 2)); if (!chunk || chunk.lane !== "isolated" || chunk.files.length !== 1 || chunk.estimatedMs !== 105000) process.exit(1);'

      - name: Framework verification with real exit
        shell: bash
        run: node ./bin/forge.mjs verify framework --script-timeout-ms 120000
