name: Generated State Refresh V3 Once

on:
  push:
    branches:
      - chore/generated-state-refresh-v3

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          ref: chore/generated-state-refresh-v3
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: bun install --ignore-scripts

      - name: Generate canonical state and prove idempotence
        shell: bash
        run: |
          node ./bin/forge.mjs generate
          node ./bin/forge.mjs generate --check
          git diff --check

      - name: Validate generated-only scope
        shell: bash
        run: |
          mapfile -t changed < <(git status --short | sed -E 's/^.. //')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              AGENTS.md|forge.lock|src/forge/_generated/*) ;;
              *) echo "unexpected changed path before workflow cleanup: $path" >&2; exit 1 ;;
            esac
          done

      - name: Remove one-shot workflow and commit refresh
        shell: bash
        run: |
          rm .github/workflows/generated-state-refresh-v3-once.yml
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              AGENTS.md|forge.lock|src/forge/_generated/*|.github/workflows/generated-state-refresh-v3-once.yml) ;;
              *) echo "unexpected final changed path: $path" >&2; exit 1 ;;
            esac
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(compiler): refresh canonical generated state'
          git push origin HEAD:chore/generated-state-refresh-v3
