name: Windows H48 Alone 32d7d89

on:
  push:
    branches:
      - diagnostic/windows-h48-alone-32d7d89

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    env:
      SUBJECT_SHA: 32d7d89faaa3875027afbd3f0f687069777c2d6d
    steps:
      - name: Checkout exact PR39 head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: bun install --ignore-scripts

      - name: Record exact provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test -z "$(git status --porcelain=v1)"
          printf 'subject=%s\nexecution=%s\ntree=%s\n' "$SUBJECT_SHA" "$(git rev-parse HEAD)" "$(git show -s --format=%T HEAD)"

      - name: Measure H48 alone with framework budget
        shell: bash
        run: |
          start=$(node -e 'console.log(Date.now())')
          set +e
          bun test tests/agent-memory/h48-agent-memory.test.ts --timeout 120000 > "$RUNNER_TEMP/h48.log" 2>&1
          code=$?
          set -e
          end=$(node -e 'console.log(Date.now())')
          printf 'exit=%s\nduration_ms=%s\n' "$code" "$((end-start))"
          cat "$RUNNER_TEMP/h48.log"
          exit "$code"
